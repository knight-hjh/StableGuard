[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stableguard-legacy"
version = "0.1.0"
description = "Legacy C1-C5 stablecoin mechanism-recognition research implementation"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["stableguard", "stableguard.*", "static_screening", "static_screening.*"]
namespaces = false
